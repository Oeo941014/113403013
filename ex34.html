<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>刪除 age 屬性</title>
</head>
<body>
    <h3>原始物件：</h3>
    <pre id="before"></pre>

    <h3>刪除 age 屬性後：</h3>
    <pre id="after"></pre>

    <script>
        var Person = {
            firstName: "Tony",
            lastName: "Lee",
            age: 50,
            eyeColor: "Blue"
        };

        // 顯示原始屬性列表
        function showObject(obj, elementId) {
            let text = "";
            for (let key in obj) {
                text += key + " : " + obj[key] + "\n";
            }
            document.getElementById(elementId).innerText = text;
        }

        // 顯示刪除前的物件
        showObject(Person, "before");

        // 刪除 age 屬性
        delete Person.age;

        // 顯示刪除後的物件
        showObject(Person, "after");
    </script>
</body>
</html>
